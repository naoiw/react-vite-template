name: Bootstrap pnpm lockfile (temporary)

on:
  push:
    branches: [feature/bootstrap-react-vite-template]

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v4
        with:
          version: 9.14.2
      - uses: actions/setup-node@v6
        with:
          node-version: "26"
      - name: Generate pnpm lockfile
        run: pnpm install --lockfile-only --ignore-scripts
      - name: Commit lockfile
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add pnpm-lock.yaml
          if ! git diff --cached --quiet; then
            git commit -m "chore: generate pnpm lockfile"
            git push origin "HEAD:feature/bootstrap-react-vite-template"
          fi
