name: Bootstrap npm lockfile (temporary)

on:
  push:
    branches: [feature/bootstrap-react-vite-template]

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: true
      - uses: actions/setup-node@v6
        with:
          node-version: "26"
      - name: Generate reproducible npm lockfile
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund
      - name: Commit generated lockfile to bootstrap branch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          if git diff --cached --quiet; then
            echo "Lockfile already up to date"
          else
            git commit -m "chore: generate npm package lock for template"
            git push origin "HEAD:feature/bootstrap-react-vite-template"
          fi
