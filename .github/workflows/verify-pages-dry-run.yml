name: Verify shared Pages v1.1.0 (dry-run)

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  pages-dry-run:
    permissions:
      contents: read
      pages: write
      id-token: write
    uses: naoiw/.github/.github/workflows/reusable-vite-pages.yml@00047e65d7e53551e2644df02d2f22743ea2c471
    with:
      dry-run: true
      package-manager: pnpm
      node-version: "26"
      pnpm-version: "9.14.2"
      publish-preview: false
