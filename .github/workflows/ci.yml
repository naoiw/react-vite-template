name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  shared-check:
    uses: naoiw/.github/.github/workflows/reusable-node-ci.yml@00047e65d7e53551e2644df02d2f22743ea2c471
    with:
      package-manager: pnpm
      node-version: "26"
      pnpm-version: "9.14.2"
      run-lint: true
      run-typecheck: true
      run-tests: false
      run-build: true
